version: "3"

includes:
  linux: Taskfile.linux.yml
  windows: Taskfile.windows.yml

tasks:

  check:
    desc: Format + lint (OS-dispatched)
    cmds:
      - cmd: task linux:check
        platforms: [linux]
      - cmd: task windows:check
        platforms: [windows]

  build:
    desc: Build StayAwake (OS-dispatched)
    cmds:
      - cmd: task linux:build
        platforms: [linux]
      - cmd: task windows:build
        platforms: [windows]

  run:
    desc: Run StayAwake (OS-dispatched)
    cmds:
      - cmd: task linux:run
        platforms: [linux]
      - cmd: task windows:run
        platforms: [windows]

  install-deps:
    desc: Install platform build dependencies
    cmds:
      - cmd: task linux:install-deps
        platforms: [linux]

  build-linux:
    desc: Build StayAwake for Linux (cross-compile from any OS)
    cmds:
      - mise x -- zig build
    sources:
      - src/*

  build-windows:
    desc: Build StayAwake for Windows (cross-compile from any OS)
    cmds:
      - |
        if [ -f "./zig-out/bin/StayAwake-windows-x86_64.exe" ]; then
          mv ./zig-out/bin/StayAwake-windows-x86_64.exe ./zig-out/bin/StayAwake-windows-x86_64.exe~
        fi
      - mise x -- zig build -Dtarget=x86_64-windows-gnu
    sources:
      - src/*

  release:
    desc: "Create new release and publish on GitHub (Usage: task release VERSION=1.2.5)"
    cmds:
      - opencode run --command generate-release-notes
      - opencode run --command bump-version -- {{.VERSION}}
      - git add src/app_state.h build.zig.zon resource.rc
      - 'git commit -m "chore: prepare release v{{.VERSION}}"'
      - git push
      - task: build-linux
      - task: build-windows
      - |
        mise x -- gh release create "v{{.VERSION}}" \
          ./zig-out/bin/StayAwake-linux-x86_64 \
          ./zig-out/bin/StayAwake-windows-x86_64.exe \
          --title "v{{.VERSION}}: $(cat release_title.txt)" \
          --notes-file release_notes.md
      - rm release_title.txt release_notes.md
    preconditions:
      - sh: 'test -n "{{.VERSION}}"'
        msg: "Error: VERSION variable is missing."
      - sh: "mise x -- gh auth status"
        msg: "Error: You must be logged into the GitHub CLI."
      - sh: "git diff --exit-code"
        msg: "Error: You have uncommitted changes."
